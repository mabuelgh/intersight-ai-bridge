spec_version: 2
description: Run a simple shell grain

inputs:
  agent:
    type: agent
  PROXY_URL:
    type: string
    default: 'http://your-proxy.company.com:80'
  INTERSIGHT_API_KEY_ID:
    type: string
    default: 'your_api_key_id_here'
  INTERSIGHT_PRIVATE_KEY:
    type: string
    default: '-----BEGIN EC PRIVATE KEY----- your_private_key_here -----END EC PRIVATE KEY-----'
  INTERSIGHT_HOST:
    type: string
    default: 'https://intersight.com'
  SERVER_SERIAL:
    type: string
    default: 'your_server_serial_here'
  SERVER_NAME:
    type: string
    default: 'your_server_name_here'
  SERVER_PROFILE_NAME:
    type: string
    default: 'IAIB-AI-IMM-1'
  NATIVE_VLAN_ID:
    type: string
    default: '100'
  ALLOWED_VLANS:
    type: string
    default: '100'
  INBAND_VLAN_ID:
    type: string
    default: '100'
  MGMT_IP_FROM:
    type: string
    default: '192.168.1.100'
  MGMT_IP_TO:
    type: string
    default: '192.168.1.100'
  MGMT_GATEWAY:
    type: string
    default: '192.168.1.1'
  MGMT_PRIMARY_DNS:
    type: string
    default: '8.8.8.8'
  MGMT_SECONDARY_DNS:
    type: string
    default: '8.8.4.4'
  POLICIES_PREFIX:
    type: string
    default: 'IAIB'  
  ORGANIZATION_NAME:
    type: string
    default: 'default'
  OS_IMAGE_NAME:
    type: string
    default: 'ubuntu-24.04.3-live-server-amd64.iso'
  SCU_IMAGE_NAME:
    type: string
    default: 'SCU.7.1.4.iso'
  SERVER_IP_ADDRESS:
    type: string
    default: '192.168.1.100/24'
  SERVER_GATEWAY:
    type: string
    default: '192.168.1.1'
  SERVER_INTERFACE:
    type: string
    default: 'eno5'
  SERVER_HOSTNAME:
    type: string
    default: 'ai-server'
  SERVER_TIMEZONE:
    type: string
    default: 'UTC'
  PRIMARY_DNS:
    type: string
    default: '8.8.8.8'
  SECONDARY_DNS:
    type: string
    default: '8.8.4.4'
 
grains:
  
  step2:
    kind: shell
    spec:
      agent:
        name: '{{ .inputs.agent }}'
      files:
        - source: qualy_samples
          path: scripts/wait_for_finish_task.py
      env-vars:
        - HTTPS_PROXY: '{{ .inputs.PROXY_URL }}'
        - HTTP_PROXY: '{{ .inputs.PROXY_URL }}'
        - https_proxy: '{{ .inputs.PROXY_URL }}'
        - http_proxy: '{{ .inputs.PROXY_URL }}'
      activities:
        deploy:
          commands:
            - name: step2
              command: |
                set -e
                WORKDIR=$PWD
                git clone https://github.com/mabuelgh/intersight-ai-bridge 
                test -d intersight-ai-bridge/intersight || { echo "ERROR: git_clone failed, aborting"; exit 1; }
                cd intersight-ai-bridge/intersight
                pip install -r requirements.txt
                cp .env.example .env
                printf "%s" "{{ .inputs.INTERSIGHT_PRIVATE_KEY }}" > SecretKey0.txt
                sed 's/-----BEGIN EC PRIVATE KEY----- /-----BEGIN EC PRIVATE KEY-----\n/; s/ -----END EC PRIVATE KEY-----/\n-----END EC PRIVATE KEY-----/' SecretKey0.txt > SecretKey.txt
                cat > .env << 'EOF'
                SERVER_SERIAL={{ .inputs.SERVER_SERIAL }}
                SERVER_PROFILE_NAME={{ .inputs.SERVER_PROFILE_NAME }}
                NATIVE_VLAN_ID={{ .inputs.NATIVE_VLAN_ID }}
                ALLOWED_VLANS={{ .inputs.ALLOWED_VLANS }}
                INBAND_VLAN_ID={{ .inputs.INBAND_VLAN_ID }}
                MGMT_IP_FROM={{ .inputs.MGMT_IP_FROM }}
                MGMT_IP_TO={{ .inputs.MGMT_IP_TO }}
                MGMT_GATEWAY={{ .inputs.MGMT_GATEWAY }}
                MGMT_PRIMARY_DNS={{ .inputs.MGMT_PRIMARY_DNS }}
                MGMT_SECONDARY_DNS={{ .inputs.MGMT_SECONDARY_DNS }}
                POLICIES_PREFIX={{ .inputs.POLICIES_PREFIX }}
                INTERSIGHT_HOST={{ .inputs.INTERSIGHT_HOST }}
                INTERSIGHT_API_KEY_ID={{ .inputs.INTERSIGHT_API_KEY_ID }}
                INTERSIGHT_PRIVATE_KEY_PATH=./SecretKey.txt
                ORGANIZATION_NAME={{ .inputs.ORGANIZATION_NAME }}
                SERVER_NAME={{ .inputs.SERVER_NAME }}
                OS_IMAGE_NAME={{ .inputs.OS_IMAGE_NAME }}
                SCU_IMAGE_NAME={{ .inputs.SCU_IMAGE_NAME }}
                PROXY_URL={{ .inputs.PROXY_URL }}
                SERVER_IP_ADDRESS={{ .inputs.SERVER_IP_ADDRESS }}
                SERVER_GATEWAY={{ .inputs.SERVER_GATEWAY }}
                SERVER_INTERFACE={{ .inputs.SERVER_INTERFACE }}
                SERVER_HOSTNAME={{ .inputs.SERVER_HOSTNAME }}
                SERVER_TIMEZONE={{ .inputs.SERVER_TIMEZONE }}
                PRIMARY_DNS={{ .inputs.PRIMARY_DNS }}
                SECONDARY_DNS={{ .inputs.SECONDARY_DNS }}
                EOF

                PROXY_URL="{{ .inputs.PROXY_URL }}"
                PLACEHOLDER="http://your-proxy.company.com:80"

                if [ -n "$PROXY_URL" ] && [ "$PROXY_URL" != "$PLACEHOLDER" ] && ! grep -q 'proxy=' os_install.py; then
                    sed -i "/apiClient = intersight.ApiClient(conf)/i conf.proxy = \"$PROXY_URL\"" os_install.py
                    echo "Proxy added: $PROXY_URL"
                elif [ "$PROXY_URL" == "$PLACEHOLDER" ]; then
                    echo "PROXY_URL is still the placeholder value — skipping proxy injection."
                elif [ -z "$PROXY_URL" ]; then
                    echo "PROXY_URL is empty — skipping proxy injection."
                else
                    echo "proxy= already present in os_install.py — skipping to avoid duplication."
                fi


                python generate_config.py --ubuntu
                echo "Configuration generated successfully."
                python os_install.py
                sleep 10
                set +e
                python -u $WORKDIR/wait_for_finish_task.py --deployos
                EXIT_CODE=$?
                set -e
                if [ $EXIT_CODE -eq 1 ]; then
                    echo "OS Install failed."
                elif [ $EXIT_CODE -eq 2 ]; then
                    echo "OS Install is taking too long or not found."
                elif [ $EXIT_CODE -eq 0 ]; then
                    echo "OS Install completed successfully."
                else
                    echo "Unexpected exit code from wait_for_finish_task.py for OS install: $EXIT_CODE"
                fi
                echo "Step 2 ended."


