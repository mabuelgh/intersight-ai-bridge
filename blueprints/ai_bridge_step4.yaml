spec_version: 2
description: Run step 4 of the AI Bridge deployment process, which executes the selected use case scenario on the server. Might need to elevate the timeout above 2 hours, depending on the speed of the network.

inputs:
  agent:
    type: agent
  # STEP 1: JSON Configuration Template Variables
  PROXY_URL:
    type: string
    default: 'http://your-proxy.company.com:80'
  INTERSIGHT_API_KEY_ID:
    type: string
    default: 'your_api_key_id_here'
  INTERSIGHT_PRIVATE_KEY:
    type: string
    default: '-----BEGIN EC PRIVATE KEY----- your_private_key_here -----END EC PRIVATE KEY-----'
  INTERSIGHT_HOST:
    type: string
    default: 'https://intersight.com'
  SERVER_SERIAL:
    type: string
    default: 'your_server_serial_here'
  SERVER_NAME:
    type: string
    default: 'your_server_name_here'
  SERVER_PROFILE_NAME:
    type: string
    default: 'IAIB-AI-IMM-1'
  NATIVE_VLAN_ID:
    type: string
    default: '100'
  ALLOWED_VLANS:
    type: string
    default: '100'
  INBAND_VLAN_ID:
    type: string
    default: '100'
  MGMT_IP_FROM:
    type: string
    default: '192.168.1.100'
  MGMT_IP_TO:
    type: string
    default: '192.168.1.100'
  MGMT_GATEWAY:
    type: string
    default: '192.168.1.1'
  MGMT_PRIMARY_DNS:
    type: string
    default: '8.8.8.8'
  MGMT_SECONDARY_DNS:
    type: string
    default: '8.8.4.4'
  POLICIES_PREFIX:
    type: string
    default: 'IAIB'  
  ORGANIZATION_NAME:
    type: string
    default: 'default'
  OS_IMAGE_NAME:
    type: string
    default: 'ubuntu-24.04.3-live-server-amd64.iso'
  SCU_IMAGE_NAME:
    type: string
    default: 'SCU.7.1.4.iso'
  SERVER_IP_ADDRESS:
    type: string
    default: '192.168.1.100/24'
  SERVER_GATEWAY:
    type: string
    default: '192.168.1.1'
  SERVER_INTERFACE:
    type: string
    default: 'eno5'
  SERVER_HOSTNAME:
    type: string
    default: 'ai-server'
  SERVER_TIMEZONE:
    type: string
    default: 'UTC'
  PRIMARY_DNS:
    type: string
    default: '8.8.8.8'
  SECONDARY_DNS:
    type: string
    default: '8.8.4.4'
  USE_CASE_SCENARIO:
    type: string
    default: '3'
 
grains:
  step4:
    kind: shell
    spec:
      agent:
        name: '{{ .inputs.agent }}'
      files:
        - source: qualy_samples
          path: scripts/wait_for_finish_task.py
      activities:
        deploy:
          commands:
            - name: step4
              command: |
                set -e
                WORKDIR=$PWD

                PROXY_URL={{ .inputs.PROXY_URL }}
                export http_proxy="$PROXY_URL" https_proxy="$PROXY_URL" HTTP_PROXY="$PROXY_URL" HTTPS_PROXY="$PROXY_URL"

                # Start of the step 4
                apt-get update -y
                apt-get install -y sshpass netcat-openbsd
                SERVER_IP=$(echo "{{ .inputs.SERVER_IP_ADDRESS }}" | cut -d'/' -f1)
                # Check TCP/22 instead of ICMP: ping is often filtered on the agent's network path even when SSH is reachable
                ATTEMPTS=10
                for i in $(seq 1 $ATTEMPTS); do
                  if nc -z -w 3 $SERVER_IP 22 &> /dev/null; then
                    echo "Server $SERVER_IP is reachable on port 22. Proceeding with SSH."
                    break
                  else
                    echo "Attempt $i: Server $SERVER_IP is not reachable on port 22. Retrying in 30 seconds..."
                    sleep 30
                  fi
                  if [ $i -eq $ATTEMPTS ]; then
                    echo "Server $SERVER_IP is not reachable on port 22 after $ATTEMPTS attempts. Exiting."
                    exit 1
                  fi
                done
                # Need to remove the hardcoded password and use a reading of the password from an input
                sshpass -p "UbuntuPWD" ssh -o StrictHostKeyChecking=no ubuntu@${SERVER_IP} << 'EOF'
                  cd intersight-ai-bridge
                  ./scenario{{ .inputs.USE_CASE_SCENARIO }}.sh
                EOF

                echo "Step 4 ended. You can access your server and try out the LLM installed."


